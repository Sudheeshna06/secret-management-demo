name: Secret Management Demo

on:
  push:
    branches:
      - main

jobs:
  secret-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Use Encrypted Secret
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          echo "Secret loaded successfully"
          echo "Database password is securely available"
